spring.application.name=chavePix-service

spring.datasource.url=jdbc:postgresql://localhost:5432/pixservice
spring.datasource.username=pix
spring.datasource.password=pix
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics

logging.level.root=INFO
logging.level.com.example.pixservice=DEBUG